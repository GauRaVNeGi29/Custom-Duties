# Render Blueprint – Setu Import Duties on Render's free plan.
# Render → New → Blueprint → pick this repository. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: setu-duties
    runtime: docker
    plan: free
    region: ohio            # next to Neon's AWS US East (Ohio)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL     # Neon connection string, ending in &connection_limit=5&max_idle_connection_lifetime=60
        sync: false
      - key: SHOPIFY_API_KEY  # production app client ID
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL  # https://setu-duties.onrender.com (or the address Render shows)
        sync: false
      - key: NODE_ENV
        value: production
