# Checks every push: install, type check, lint, Prisma schema, tests, build.
# (Replaces the Shopify template's own CI, which tested npm/yarn/pnpm.)
on: [push, pull_request]

name: CI

jobs:
  CI:
    name: Type check, lint and build
    runs-on: ubuntu-latest
    env:
      # Placeholder so Prisma can read the schema; CI never connects to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and validate schema
        run: npx prisma generate && npx prisma validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (no database)
        run: npx vitest run tests/engine.test.ts tests/csv.test.ts tests/cart.test.ts tests/currency.test.ts

      - name: Build
        run: npm run build
